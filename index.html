<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abhishek Nadagiri — Software Engineer · Prompt Engineer · Content Creator</title>
    <meta name="description" content="Portfolio of Abhishek Nadagiri. Building at the intersection of software engineering, prompt engineering, and content creation." />

    <!-- Open Graph -->
    <meta property="og:title" content="Abhishek Nadagiri — Portfolio" />
    <meta property="og:description" content="Software Engineer • Prompt Engineer • Content Creator" />
    <meta property="og:type" content="website" />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Abhishek Nadagiri — Portfolio" />
    <meta name="twitter:description" content="Software Engineer • Prompt Engineer • Content Creator" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Prevent FOUC: set theme before paint -->
    <script>
      (function() {
        var s = localStorage.getItem('portfolio-theme');
        var d = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', s ? s === 'dark' : d);
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
